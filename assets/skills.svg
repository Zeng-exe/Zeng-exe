<svg xmlns="http://www.w3.org/2000/svg" width="800" height="238" viewBox="0 0 800 238">
  <style>
    svg { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @keyframes chip0 { 0%,0% { opacity: 0; transform: translateY(6px) } 2%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
    @keyframes chip1 { 0%,3% { opacity: 0; transform: translateY(6px) } 5%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
    @keyframes chip2 { 0%,5% { opacity: 0; transform: translateY(6px) } 7%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
    @keyframes chip3 { 0%,8% { opacity: 0; transform: translateY(6px) } 10%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
    @keyframes chip4 { 0%,10% { opacity: 0; transform: translateY(6px) } 12%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
    @keyframes chip5 { 0%,13% { opacity: 0; transform: translateY(6px) } 15%,92% { opacity: 1; transform: translateY(0) } 97%,100% { opacity: 0 } }
    .chip0 { animation: chip0 9s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .chip1 { animation: chip1 9s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .chip2 { animation: chip2 9s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .chip3 { animation: chip3 9s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .chip4 { animation: chip4 9s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .chip5 { animation: chip5 9s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  </style>
  <rect width="100%" height="100%" fill="#0d0d10" rx="14" ry="14"/>

  <!-- Accent bar -->
  <rect x="56" y="74" width="56" height="3" rx="1.5" fill="#1dfa00"/>

  <!-- Heading -->
  <text x="56" y="56" fill="#f7f7fb" font-size="30" font-weight="700" letter-spacing="-0.02em">Stack.</text>

  <!-- Sub-line -->
  <text x="56" y="104" fill="#2de18d" font-size="13" font-weight="500" letter-spacing="0.02em">6 tools I reach for daily.</text>

  <!-- Pill rows -->
  <g class="chip0">
        <rect x="140" y="134" width="79" height="28" rx="14" fill="#0d0d10" stroke="#2de18d" stroke-width="1" stroke-opacity="0.55"/>
        <text x="179.5" y="148" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">PYTHON</text>
      </g>
  <g class="chip1">
        <rect x="229" y="134" width="70.2" height="28" rx="14" fill="#0d0d10" stroke="#2de18d" stroke-width="1" stroke-opacity="0.55"/>
        <text x="264.1" y="148" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">LINUX</text>
      </g>
  <g class="chip2">
        <rect x="309.2" y="134" width="70.2" height="28" rx="14" fill="#0d0d10" stroke="#2de18d" stroke-width="1" stroke-opacity="0.55"/>
        <text x="344.3" y="148" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">REDES</text>
      </g>
  <g class="chip3">
        <rect x="389.3999999999999" y="134" width="156.2" height="28" rx="14" fill="#0d0d10" stroke="#2de18d" stroke-width="1" stroke-opacity="0.55"/>
        <text x="467.5" y="148" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">ETHICAL HACKING</text>
      </g>
  <g class="chip4">
        <rect x="555.5999999999999" y="134" width="104.4" height="28" rx="14" fill="#0d0d10" stroke="#2de18d" stroke-width="1" stroke-opacity="0.55"/>
        <text x="607.8" y="148" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">BLUE TEAM</text>
      </g>
  <g class="chip5">
        <rect x="269.99999999999994" y="172" width="259.8" height="28" rx="14" fill="#0d0d10" stroke="#2de18d" stroke-width="1" stroke-opacity="0.55"/>
        <text x="399.9" y="186" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">ANÁLISE DE VULNERABILIDADES</text>
      </g>
</svg>